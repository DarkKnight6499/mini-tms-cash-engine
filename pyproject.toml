[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-tms-cash-engine"
version = "0.1.0"
description = "Synthetic treasury workflow, statement reconciliation, forecasting and payment controls"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = ["numpy>=1.24", "pandas>=2.0"]
license = "MIT"

[project.optional-dependencies]
corporate = ["matplotlib>=3.7", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
